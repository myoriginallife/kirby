<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#241a4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>별의 커비 캐릭터 맞히기</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=1" />
  </head>
  <body>
  <div id="app">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <div class="screen-inner">
        <div class="logo">
          <div id="logo-art" class="logo-art bouncing" aria-hidden="true"></div>
          <h1>별의 커비<br />캐릭터 맞히기</h1>
        </div>
        <p class="subtitle">레벨이 올라갈수록 난이도가 높아집니다!</p>

        <button id="start-btn" class="cta">게임 시작</button>

        <div class="best-scores">
          <p class="picker-label">최고 기록</p>
          <div class="best-scores-grid single">
            <div class="best-score-item active">
              <span class="best-diff-label">최고 점수</span>
              <span id="best-score" class="best-diff-value">0</span>
            </div>
            <div class="best-score-item">
              <span class="best-diff-label">최고 레벨</span>
              <span id="best-level" class="best-diff-value">1</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen">
      <header class="game-header">
        <div class="stat">
          <span class="stat-label">점수</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat center">
          <span class="stat-label">레벨</span>
          <span id="level" class="stat-value level">1</span>
        </div>
        <div class="stat right">
          <span class="stat-label">목숨</span>
          <div id="lives" class="lives"></div>
        </div>
      </header>

      <div class="level-progress">
        <div class="level-bar-track">
          <div id="level-fill" class="level-bar-fill"></div>
        </div>
        <div class="level-progress-meta">
          <div class="mini-stat">
            <span class="mini-label">연속</span>
            <span id="streak" class="mini-value streak">0</span>
          </div>
          <span id="level-count" class="level-count">0 / 10</span>
        </div>
      </div>

      <div class="question-area">
        <p id="question-label" class="question-label">이 캐릭터의 이름은?</p>
        <div class="char-card">
          <span id="category-tag" class="category-tag">친구·주인공</span>
          <div id="char-art" class="char-art" role="img" aria-label="문제 캐릭터"></div>
          <div id="char-hint" class="char-hint">💡</div>
        </div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback hidden" aria-live="polite">
        <p id="feedback-text"></p>
      </div>
    </section>

    <!-- 게임 오버 화면 -->
    <section id="gameover-screen" class="screen">
      <div class="screen-inner">
        <h2 class="gameover-title">게임 종료!</h2>
        <div class="result-stats">
          <div class="result-stat">
            <span class="result-label">최종 점수</span>
            <span id="final-score" class="result-value">0</span>
          </div>
          <div class="result-stat">
            <span class="result-label">도달 레벨</span>
            <span id="final-level" class="result-value">1</span>
          </div>
          <div class="result-stat">
            <span class="result-label">맞힌 문제</span>
            <span id="final-correct" class="result-value">0</span>
          </div>
          <div class="result-stat">
            <span class="result-label">최대 연속</span>
            <span id="final-streak" class="result-value">0</span>
          </div>
        </div>
        <div id="new-record" class="new-record hidden">🏆 신기록!</div>
        <button id="share-btn" class="cta share">📸 결과 이미지 공유</button>
        <button id="retry-btn" class="cta">다시 하기</button>
        <button id="menu-btn" class="cta secondary">메인으로</button>
      </div>
    </section>

    <!-- 레벨업 -->
    <div id="levelup-overlay" class="levelup-overlay hidden">
      <div class="levelup-content">
        <div class="warp-star" aria-hidden="true">★</div>
        <p class="levelup-badge">LEVEL UP!</p>
        <p id="levelup-num" class="levelup-num">Level 2</p>
        <p id="levelup-desc" class="levelup-desc"></p>
      </div>
    </div>

    <!-- 공유 미리보기 -->
    <div id="share-modal" class="share-modal hidden">
      <div class="share-modal-backdrop"></div>
      <div class="share-modal-content">
        <h3 class="share-modal-title">결과 이미지</h3>
        <img id="share-preview" alt="게임 결과" />
        <div class="share-modal-actions">
          <button id="share-confirm-btn" class="cta">공유하기</button>
          <button id="share-download-btn" class="cta secondary">저장하기</button>
          <button id="share-close-btn" class="cta secondary">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="share-canvas" hidden></canvas>

  <footer class="site-footer">
    <p class="footer-credit">Made by JION KIM</p>
    <p class="footer-note">Unofficial fan game</p>
  </footer>

  <script src="art.js?v=1"></script>
  <script src="game.js?v=2"></script>
  </body>
</html>
